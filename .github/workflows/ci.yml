name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The web engine's tests and the example's end-to-end tests drive Chromium.
      - run: pnpm --filter @vyntra/web exec playwright install --with-deps chromium
      - run: pnpm lint
      # The example's AI tests replay what was recorded with this provider and model (CI is set: no model calls, no
      # keys).
      - run: pnpm test
        env:
          VYNTRA_AI_PROVIDER: openrouter
          VYNTRA_AI_MODEL: deepseek/deepseek-v4-flash

  # Is this change slower? The synthetic suite run with the base vyntra and this one, alternately on the same
  # machine: on a pull request against its base, on a push against the commit before.
  bench:
    name: Benchmark gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Compare with the base
        run: node packages/vyntra/bench/gate.js --base ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

